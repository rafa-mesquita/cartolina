<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tatubum · protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  :root {
    --ink: #2b1a10; --night: #0e0e1c; --paper: #f4e9d0; --yellow: #f2c14e; --red: #e4572e;
    --btn: #e0605a; --btn-edge: #1a0f1f; --btn-hi: #f08a80; --btn-lo: #b8423e; --cream: #fff3e0;
    --txt: #f4e9d0; --dim: #9fb0d8;
    --px: 'Press Start 2P', monospace; --vt: 'VT323', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden; }
  body { font-family: var(--vt); color: var(--txt); user-select: none; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1440px; height: 900px; --w: 1440px; transform-origin: center; overflow: hidden; image-rendering: pixelated; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  img { image-rendering: pixelated; }

  /* Botões chanfrados (aprovados no mockup) */
  .btn { position: relative; display: inline-flex; height: 46px; min-width: 150px; padding: 4px; border: none; background: var(--btn-edge); cursor: pointer;
    clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0 50%); }
  .btn > span { flex: 1; height: 100%; background: var(--btn); display: flex; align-items: center; justify-content: center; padding: 0 22px; white-space: nowrap;
    clip-path: polygon(11px 0, calc(100% - 11px) 0, 100% 50%, calc(100% - 11px) 100%, 11px 100%, 0 50%);
    font-family: var(--px); font-size: 13px; color: var(--cream); text-shadow: 2px 2px 0 #8c2f2f; box-shadow: inset 0 4px 0 var(--btn-hi), inset 0 -5px 0 var(--btn-lo); }
  .btn:hover > span { background: #ea736c; }
  .btn:active > span { transform: translateY(2px); }
  .btn.yellow > span { background: var(--yellow); color: var(--ink); text-shadow: 2px 2px 0 #c9962c; box-shadow: inset 0 4px 0 #f7d886, inset 0 -5px 0 #c9962c; }
  .btn.yellow:hover > span { background: #f6cd6b; }
  .btn.ghost > span { background: #2c3a66; text-shadow: 2px 2px 0 #141f42; box-shadow: inset 0 4px 0 #3f5590, inset 0 -5px 0 #1a2a50; }
  .btn.small { height: 36px; min-width: 0; }
  .btn.small > span { font-size: 10px; padding: 0 16px; }
  .btn[disabled] { cursor: default; filter: grayscale(.85) brightness(.7); }

  /* Barra do topo */
  #topbar { position: absolute; left: 0; right: 0; top: 0; height: 48px; background: rgba(14,14,28,.88); display: flex; align-items: center; justify-content: space-between; padding: 0 18px; box-shadow: 0 4px 0 #050510; z-index: 5; }
  #logo { font-family: var(--px); font-size: 18px; color: var(--yellow); text-shadow: 2px 0 0 #3b2412, -2px 0 0 #3b2412, 0 2px 0 #3b2412, 0 -2px 0 #3b2412, 3px 3px 0 #050510; }
  #turn { font-family: var(--px); font-size: 12px; color: var(--cream); }
  #turn b { color: var(--yellow); }
  #turn .owed { color: var(--red); margin-left: 8px; animation: blink 0.9s steps(2) infinite; }
  #topright { display: flex; gap: 8px; }

  /* Assentos dos bots */
  #seats { position: absolute; left: 0; right: 0; top: 60px; height: 170px; z-index: 2; }
  .seat { position: absolute; width: 150px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 6px; cursor: default; }
  .seat .tatu { width: 80px; height: 44px; }
  .seat .critter { width: 68px; height: 68px; filter: drop-shadow(3px 3px 0 rgba(5,5,16,.6)); }
  .seat .who { font-family: var(--px); font-size: 10px; color: var(--cream); text-shadow: 2px 2px 0 #050510; margin-top: 4px; }
  .seat .count { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
  .seat .count .fan { position: relative; width: 44px; height: 34px; }
  .seat .count .fan i { position: absolute; left: 14px; top: 2px; width: 16px; height: 23px; background: #1f3a6b; transform-origin: 50% 120%;
    box-shadow: 0 -2px 0 var(--ink), 0 2px 0 var(--ink), -2px 0 0 var(--ink), 2px 0 0 var(--ink); background-image: linear-gradient(#f2c14e, #f2c14e); background-size: 6px 4px; background-repeat: no-repeat; background-position: center; }
  .seat .count b { font-family: var(--px); font-size: 20px; font-weight: normal; color: var(--yellow); text-shadow: 3px 3px 0 #050510, -2px 0 0 #050510, 0 -2px 0 #050510; min-width: 26px; }
  .seat .count.out { font-family: var(--px); font-size: 11px; color: var(--dim); }
  .seat .chip { font-family: var(--px); font-size: 8px; padding: 4px 6px; background: #2c3a66; color: var(--cream); margin-top: 2px; }
  .seat.turn { background: rgba(242,193,78,.16); box-shadow: 0 -3px 0 var(--yellow), 0 3px 0 var(--yellow), -3px 0 0 var(--yellow), 3px 0 0 var(--yellow); }
  .seat.turn .who::before { content: '▶ '; color: var(--yellow); }
  .seat.dead { opacity: .55; filter: grayscale(1); }
  .seat.winner { z-index: 45; background: rgba(242,193,78,.25); box-shadow: 0 -4px 0 var(--yellow), 0 4px 0 var(--yellow), -4px 0 0 var(--yellow), 4px 0 0 var(--yellow); }
  .seat.winner .who::before { content: '♛ '; color: var(--yellow); }
  .seat.dead .who::after { content: ' ✝'; }
  .seat.targetable { cursor: pointer; animation: pulse .6s steps(2) infinite; }
  .seat.targetable:hover { background: rgba(228,87,46,.25); }
  .seat.hit { animation: hit .5s steps(4); }
  @keyframes pulse { 50% { box-shadow: 0 -3px 0 var(--red), 0 3px 0 var(--red), -3px 0 0 var(--red), 3px 0 0 var(--red); } }
  @keyframes hit { 25% { transform: translateX(-50%) translateY(-8px); } 75% { transform: translateX(-50%) translateY(4px); } }
  @keyframes blink { 50% { opacity: .35; } }

  /* Legenda em quadrinho */
  #caption { position: absolute; left: calc(200px + (var(--bw) - 540px) / 2); top: 238px; transform: translateX(-50%); min-width: 380px; max-width: 760px; padding: 10px 18px 8px; background: var(--paper); color: var(--ink);
    font-size: 28px; line-height: 1; text-align: center; box-shadow: 0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink), 6px 8px 0 rgba(0,0,0,.35); z-index: 4; }
  #caption:empty { display: none; }
  #caption .timer { color: var(--red); margin-left: 8px; }

  /* Mesa */
  #table { position: absolute; left: 200px; top: 300px; width: calc(var(--bw) - 540px); height: 270px; background: #2e5a3a; z-index: 1;
    box-shadow: 0 -6px 0 var(--night), 0 6px 0 var(--night), -6px 0 0 var(--night), 6px 0 0 var(--night), 10px 14px 0 rgba(0,0,0,.4);
    background-image: radial-gradient(#33653f 1.5px, transparent 1.6px); background-size: 8px 8px; }
  .slot { position: absolute; top: 40px; width: 140px; height: 190px; display: flex; align-items: center; justify-content: center; }
  .slot .label { position: absolute; bottom: -30px; left: 0; right: 0; text-align: center; font-size: 22px; color: var(--cream); text-shadow: 2px 2px 0 #050510; }
  #deck { left: 90px; cursor: pointer; }
  #deck .stack { position: relative; width: 112px; height: 156px; }
  #deck .stack .card { position: absolute; left: 0; top: 0; }
  #deck.shuffling .stack .card { animation: shuffle .12s steps(2) 6; }
  #deck.mine:hover .stack .card:last-child { transform: translate(-4px, -10px); }
  @keyframes shuffle { 50% { translate: 10px -6px; } }
  #air { left: calc(50% - 70px); }
  #air .card { position: absolute; }
  #air .empty { width: 112px; height: 156px; border: 4px dashed rgba(244,233,208,.35); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 22px; color: rgba(244,233,208,.5); }
  #bar { position: absolute; left: calc(50% - 70px); top: 248px; width: 140px; display: flex; justify-content: center; gap: 6px; }
  #bar i { width: 18px; height: 12px; background: #1a2a20; box-shadow: 0 0 0 3px var(--night); }
  #bar i.on { background: var(--red); }
  #bar i.on.last { animation: blink .3s steps(2) infinite; }
  #discard { left: auto; right: 90px; }
  #discard .card { position: absolute; }
  #future { position: absolute; left: 230px; top: 46px; display: flex; flex-direction: column; gap: 4px; }
  #future .tag { font-family: var(--px); font-size: 8px; color: var(--yellow); margin-bottom: 2px; }
  #future .card { transform: scale(.38); transform-origin: left top; margin-bottom: -96px; }

  /* Cartas */
  .card { width: 112px; height: 156px; background: var(--paper); color: var(--ink); position: relative; display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink), 5px 8px 0 rgba(0,0,0,.35); }
  .card .band { width: 100%; height: 14px; }
  .card .art { width: 80px; height: auto; margin-top: 12px; }
  .card .name { font-family: var(--px); font-size: 9px; margin-top: auto; text-align: center; padding: 0 4px; }
  .card .hint { font-size: 16px; line-height: 1; margin: 4px 0 8px; color: #6b5440; text-align: center; padding: 0 4px; }
  .card.back { background: #1f3a6b; background-image: radial-gradient(#2c5a8c 1.5px, transparent 1.6px); background-size: 10px 10px; justify-content: center; }
  .card.back .art { width: 74px; margin-top: 0; }
  .card.back .name { color: var(--yellow); margin: 10px 0 0; font-size: 9px; text-shadow: 2px 2px 0 var(--ink); }
  /* Categorias (pedido do Rafa): bomba vermelha, desarme amarelo, pares verde-água, efeitos no creme */
  .card.cat-bomb { background: #e4572e; color: var(--cream); }
  .card.cat-bomb .hint { color: #fff3c4; }
  .card.cat-defuse { background: #f2c14e; }
  .card.cat-defuse .hint { color: #5a3a10; }
  .card.cat-pair { background: #5cc8b8; }
  .card.cat-pair .hint { color: #1d4f48; }
  .card .art.flow { width: 96px; height: 96px; margin-top: 8px; image-rendering: auto; }
  .card.flow-back { padding: 0; overflow: hidden; }
  .card.flow-back .back-art { width: 100%; height: 100%; object-fit: cover; }
  .flying { position: absolute; left: 0; top: 0; z-index: 30; pointer-events: none; }

  /* Mão */
  #hand { position: absolute; left: 190px; width: calc(var(--bw) - 500px); bottom: 26px; height: 200px; z-index: 6; }
  #hand .card { position: absolute; bottom: 0; cursor: pointer; transition: none; }
  #hand .card:hover { bottom: 14px; }
  #hand .card.sel { bottom: 34px; box-shadow: 0 -4px 0 var(--yellow), 0 4px 0 var(--yellow), -4px 0 0 var(--yellow), 4px 0 0 var(--yellow), 5px 8px 0 rgba(0,0,0,.35); animation: selblink .5s steps(2) infinite; }
  #hand .card.arriving { visibility: hidden; }
  #hand .card { touch-action: none; }
  #hand .card.dragging { opacity: .25; }
  .card img { -webkit-user-drag: none; user-select: none; }
  .card.ghost { position: absolute; left: 0; top: 0; z-index: 40; pointer-events: none;
    box-shadow: 0 -4px 0 var(--yellow), 0 4px 0 var(--yellow), -4px 0 0 var(--yellow), 4px 0 0 var(--yellow), 12px 18px 0 rgba(0,0,0,.4); }
  .card.ghost[data-n]::after { content: '×' attr(data-n); position: absolute; right: -14px; top: -14px; padding: 6px 7px; background: var(--red); color: var(--cream); font-family: var(--px); font-size: 12px; box-shadow: 0 0 0 3px var(--ink); }
  #stage.dragging #table { box-shadow: 0 -6px 0 var(--yellow), 0 6px 0 var(--yellow), -6px 0 0 var(--yellow), 6px 0 0 var(--yellow), 10px 14px 0 rgba(0,0,0,.4); }
  #table.drop { background-color: #3b7349; }
  .seat.drop { background: rgba(228,87,46,.3); box-shadow: 0 -4px 0 var(--red), 0 4px 0 var(--red), -4px 0 0 var(--red), 4px 0 0 var(--red); }
  #hand.giving .card:hover { bottom: 30px; box-shadow: 0 -4px 0 var(--red), 0 4px 0 var(--red), -4px 0 0 var(--red), 4px 0 0 var(--red); }
  #hand.myturn::before { content: 'SUA VEZ'; position: absolute; left: 50%; top: -6px; transform: translateX(-50%); font-family: var(--px); font-size: 11px; color: var(--yellow); text-shadow: 2px 2px 0 #050510; animation: blink 1s steps(2) infinite; }
  #hand .dead { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); font-family: var(--px); font-size: 14px; color: var(--cream); text-shadow: 2px 2px 0 #050510; }
  @keyframes selblink { 50% { box-shadow: 0 -4px 0 #fff3c4, 0 4px 0 #fff3c4, -4px 0 0 #fff3c4, 4px 0 0 #fff3c4, 5px 8px 0 rgba(0,0,0,.35); } }

  #actions { position: absolute; right: 26px; bottom: 30px; width: 250px; display: flex; flex-direction: column; gap: 12px; align-items: stretch; z-index: 7; }
  #actions .btn { width: 100%; }
  #actions .hint { font-size: 22px; color: var(--dim); text-align: center; text-shadow: 2px 2px 0 #050510; }
  #nope.btn { height: 64px; }
  #nope.btn > span { font-size: 15px; background: var(--red); animation: nopepulse .5s steps(2) infinite; }
  @keyframes nopepulse { 50% { background: #f06b45; } }

  /* Diário */
  #log { position: absolute; right: 20px; top: 300px; width: 296px; height: 270px; padding: 10px 12px; background: rgba(14,14,28,.82); box-shadow: 0 -4px 0 #050510, 0 4px 0 #050510, -4px 0 0 #050510, 4px 0 0 #050510; z-index: 3; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  #log .h { font-family: var(--px); font-size: 9px; color: var(--yellow); margin-bottom: 6px; }
  #log p { margin: 0 0 3px; font-size: 19px; line-height: 1.05; color: var(--txt); }
  #log p.me { color: #ffd27e; }
  #log p.bad { color: #ff9b7a; }

  /* Painéis (escolhas) */
  #panel { position: absolute; left: calc(200px + (var(--bw) - 540px) / 2); top: 300px; transform: translateX(-50%); z-index: 20; min-width: 560px; padding: 22px 26px; background: #141f42;
    box-shadow: 0 -5px 0 var(--yellow), 0 5px 0 var(--yellow), -5px 0 0 var(--yellow), 5px 0 0 var(--yellow), 10px 14px 0 rgba(0,0,0,.5); }
  #panel:empty { display: none; }
  #panel h2 { margin: 0 0 6px; font-family: var(--px); font-size: 16px; color: var(--yellow); font-weight: normal; }
  #panel p { margin: 0 0 14px; font-size: 24px; }
  #panel .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  #panel .cards { display: flex; gap: 14px; margin: 22px 0 8px; }
  #panel .cards .card { cursor: pointer; }
  #panel .cards .card:hover { transform: translateY(-8px); }
  #panel input[type=range] { width: 100%; accent-color: var(--yellow); margin: 6px 0 14px; }
  #panel .pos { font-family: var(--px); font-size: 12px; color: var(--cream); margin-bottom: 4px; }
  #panel .timer { float: right; font-family: var(--px); font-size: 12px; color: var(--red); }

  /* Menu e fim */
  #menu, #over { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  #menu[hidden], #over[hidden] { display: none; }
  #stage.menu-open :is(#table, #log, #hand, #actions, #seats, #caption, #panel) { display: none; }
  #over { background: rgba(14,14,28,.55); }
  .biglogo { font-family: var(--px); font-size: 64px; color: var(--yellow); text-shadow: 5px 0 0 #3b2412, -5px 0 0 #3b2412, 0 5px 0 #3b2412, 0 -5px 0 #3b2412, 9px 9px 0 #050510; margin-bottom: 8px; }
  .sub { font-family: var(--px); font-size: 13px; color: var(--cream); text-shadow: 2px 2px 0 #050510; }
  .picker { display: flex; align-items: center; gap: 16px; }
  .picker .n { font-family: var(--px); font-size: 26px; color: var(--cream); width: 60px; text-align: center; text-shadow: 3px 3px 0 #050510; }
  #menu .btn, #over .btn { min-width: 260px; height: 54px; }
  #menu .btn > span, #over .btn > span { font-size: 15px; }
  #menu .picker .btn { min-width: 64px; height: 46px; }

  #dev { position: absolute; left: 14px; bottom: 12px; z-index: 8; display: flex; flex-direction: column; gap: 6px; }
  #dev .lbl { font-size: 18px; color: var(--dim); text-shadow: 2px 2px 0 #050510; }

  #toast { position: absolute; left: 50%; bottom: 270px; transform: translateX(-50%); z-index: 50; padding: 8px 16px; background: var(--red); color: var(--cream); font-family: var(--px); font-size: 11px;
    box-shadow: 0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink); }
  #toast:empty { display: none; }

  /* Bloco central (mesa, mão, diário): 1440 de largura, centralizado no palco que cresce até a largura da janela */
  #board { --bw: 1440px; position: absolute; left: 50%; top: 0; width: var(--bw); height: 900px; transform: translateX(-50%); pointer-events: none; z-index: 3; }
  #board > * { pointer-events: auto; }
  #board > #caption, #board > #viewer { pointer-events: none; }

  /* Efeitos */
  #fxlayer { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
  #particles { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 31; pointer-events: none; image-rendering: pixelated; }
  .stamp { position: absolute; font-family: var(--px); font-size: 26px; padding: 10px 14px; border: 6px solid currentColor; background: rgba(244,233,208,.92); white-space: nowrap; }
  .pop { position: absolute; font-family: var(--px); white-space: nowrap; text-shadow: 6px 0 0 var(--ink), -6px 0 0 var(--ink), 0 6px 0 var(--ink), 0 -6px 0 var(--ink), 10px 10px 0 rgba(0,0,0,.45); }
  .flash { position: absolute; inset: 0; }
  .cross { position: absolute; width: 150px; height: 150px; }
  .cross::before, .cross::after { content: ''; position: absolute; left: 50%; top: 50%; width: 170px; height: 22px; background: var(--red); box-shadow: 0 0 0 5px var(--ink); translate: -50% -50%; }
  .cross::before { rotate: 45deg; }
  .cross::after { rotate: -45deg; }
  #air .card .art { animation: bob .5s steps(2) infinite; }
  @keyframes bob { 50% { translate: 0 -4px; } }
  .seat .chip.think { background: #3b2412; animation: blink .8s steps(2) infinite; }

  /* Zoom de carta (rodinha) */
  #viewer { position: absolute; left: calc(200px + (var(--bw) - 540px) / 2); top: 400px; z-index: 35; pointer-events: none; transform: translate(-50%, -50%) scale(2.4); }
  #viewer:empty { display: none; }

  /* Galeria das cartas */
  #gallery { position: absolute; inset: 0; z-index: 60; background: rgba(14,14,28,.94); padding: 30px 50px; display: flex; flex-direction: column; gap: 14px; }
  #gallery[hidden] { display: none; }
  #gallery h2 { margin: 0; font-family: var(--px); font-size: 20px; color: var(--yellow); font-weight: normal; }
  #gallery .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px 30px; overflow: hidden; padding: 10px 6px; }
  #gallery .item { display: flex; gap: 22px; align-items: center; }
  #gallery .item .card { flex: none; }
  #gallery .item p { margin: 0; font-size: 23px; line-height: 1.05; }
  #gallery .item b { font-family: var(--px); font-size: 10px; color: var(--yellow); font-weight: normal; display: block; margin-bottom: 6px; }
  #gallery .foot { display: flex; justify-content: space-between; align-items: center; }
  #gallery .foot p { margin: 0; font-size: 22px; color: var(--dim); max-width: 1000px; }
  /* Tatu soldado do desarme: anda com o corpo balançando em 2 quadros e dá um tranco ao cortar o fio */
  .soldier { position: absolute; left: 0; top: 0; z-index: 33; width: 190px; image-rendering: pixelated; pointer-events: none; filter: drop-shadow(6px 6px 0 rgba(5,5,16,.45)); }
  .soldier.walking { animation: march .24s steps(2) infinite; }
  .soldier.snip { animation: snip .15s steps(2) 3; }
  @keyframes march { 50% { translate: 0 -6px; } }
  @keyframes snip { 50% { translate: 6px 0; } }
  .bigcard { position: absolute; z-index: 32; transform: translate(-50%, -50%) scale(2); }
  .bigcard.shaking { animation: shake .09s steps(2) infinite; }
  @keyframes shake { 50% { translate: 4px -3px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div id="stage" class="menu-open">
  <canvas id="bg"></canvas>
  <div id="topbar">
    <div id="logo">TATUBUM</div>
    <div id="turn"></div>
    <div id="topright">
      <button class="btn small ghost" id="sound"><span>SOM: SIM</span></button>
      <button class="btn small ghost" id="tomenu"><span>MENU</span></button>
    </div>
  </div>
  <div id="seats"></div>
  <div id="board">
  <div id="caption"></div>
  <div id="table">
    <div class="slot" id="deck"><div class="stack"></div><div class="label"></div></div>
    <div id="future"></div>
    <div class="slot" id="air"></div>
    <div id="bar"></div>
    <div class="slot" id="discard"><div class="label">descarte</div></div>
  </div>
  <div id="log"></div>
  <div id="hand"></div>
  <div id="actions"></div>
  <div id="panel"></div>
  <div id="viewer"></div>
  <div id="toast"></div>
  </div>
  <div id="dev">
    <div class="lbl">protótipo · teste</div>
    <button class="btn small ghost" id="drop"><span>DERRUBAR UM BOT</span></button>
    <button class="btn small ghost" id="speed"><span>BOTS: NORMAIS</span></button>
  </div>
  <div id="menu">
    <div class="biglogo">TATUBUM</div>
    <div class="sub">quantos bots na mesa?</div>
    <div class="picker">
      <button class="btn ghost" id="less"><span>−</span></button>
      <div class="n" id="nbots">3</div>
      <button class="btn ghost" id="more"><span>+</span></button>
    </div>
    <button class="btn yellow" id="play"><span>JOGAR</span></button>
    <button class="btn" id="cards"><span>AS CARTAS</span></button>
  </div>
  <div id="gallery" hidden></div>
  <div id="over" hidden></div>
  <div id="fxlayer"></div>
  <canvas id="particles"></canvas>
</div>

<script src="rules.js"></script>
<script src="sprites.js"></script>
<script src="cerrado.js"></script>
<script src="sounds.js"></script>
<script src="fx.js"></script>
<script src="bots.js"></script>
<script>
'use strict';
const T = Tatubum;
const $ = (s) => document.querySelector(s);
const stage = $('#stage');

// ---------------------------------------------------------------- palco
// A altura manda; a largura cresce até a da janela (sem faixas vazias nos lados), como no Diquisti.
let scale = 1;
let stageW = 1440;
const bgSeed = Math.floor(Math.random() * 1e9);
let bgWidth = 0;
function fit() {
  scale = innerHeight / 900;
  stageW = innerWidth / scale;
  if (stageW < 1440) { scale = innerWidth / 1440; stageW = 1440; }
  stageW = Math.round(stageW);
  stage.style.width = stageW + 'px';
  stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
  const p = $('#particles');
  p.width = Math.ceil(stageW / 4);
  p.height = 225;
  // O cerrado é redesenhado só quando a largura muda bastante (o resize dispara muito).
  const w = Math.round((180 * stageW) / 900);
  if (Math.abs(w - bgWidth) > 2) { bgWidth = w; Cerrado.start($('#bg'), bgSeed, w); }
  // O bloco central cresce com a tela (até 1760), pra mesa e mão aproveitarem a largura.
  $('#board').style.setProperty('--bw', Math.min(stageW, 1760) + 'px');
  if (view) { renderSeats(); renderHand(); }
}
addEventListener('resize', fit);
Fx.init(stage, $('#fxlayer'), $('#particles'), () => scale);

// ---------------------------------------------------------------- jogadores e regras reais
const NAMES = ['Você', 'Ana', 'Caio', 'Bia', 'Duda', 'Léo', 'Mari', 'Zé'];
// As cores (e os bichinhos) dos jogadores são as do site.
const COLORS = T.PLAYER_COLORS;
const ME = 'p0';
let players = [];
let active = [];
let state = T.initialKittensState();
let view = null;
let rng = T.mulberry32((Math.random() * 2 ** 32) >>> 0);
let botSpeed = 1;
const botMem = {};

const idx = (p) => Number(p.slice(1));
const nameOf = (p) => NAMES[idx(p)];
const colorOf = (p) => COLORS[idx(p)];
const kindOf = (c) => T.kittensKindOf(c);
const cardName = (k) => T.KITTENS_CARD_NAMES[k].toUpperCase();
const PLAY_LABEL = { ataque: 'ATAQUE', pular: 'PULAR', favor: 'FAVOR', embaralhar: 'EMBARALHAR', espiar: 'ESPIAR', par: 'PAR', trio: 'TRIO', cinco: '5 DIFERENTES' };

function ctx() {
  return { hostId: ME, active, rng, now: Date.now() };
}

/** Toda ação passa pelo schema e pelas regras reais, como no servidor. */
function dispatch(pid, action) {
  const parsed = T.kittensActionSchema.safeParse(action);
  const res = parsed.success ? T.applyKittensAction(state, pid, parsed.data, ctx()) : { ok: false, error: 'bad_action' };
  if (!res.ok) {
    if (pid === ME) { toast(T.errorMessage(res.error)); Sound.play('error'); }
    return false;
  }
  state = res.state;
  onState();
  return true;
}

// Alarme: o servidor resolveria os prazos; aqui um intervalo faz isso.
setInterval(() => {
  if (state.phase === 'playing') {
    const next = T.settleKittens(state, ctx());
    if (next !== state) { state = next; onState(); }
  }
  tickTimers();
}, 100);

// ---------------------------------------------------------------- fila de efeitos
const queue = [];
let running = false;
function enqueue(fn) {
  queue.push(fn);
  if (!running) runQueue();
}
async function runQueue() {
  running = true;
  while (queue.length) {
    try { await queue.shift()(); } catch (e) { console.error(e); }
  }
  running = false;
  if (arriving.size || airHidden) { arriving.clear(); airHidden = false; render(); }
}

// ---------------------------------------------------------------- estado da tela
let lastN = -1;
let selected = new Set();
let mode = null; // { type: 'target', play } | { type: 'ask', play }
const arriving = new Set();
let airHidden = false;
let captionText = '';
let lastTic = 0;

function onState() {
  const prev = view;
  const rects = handRects();
  view = T.kittensViewFor(state, ME);
  const fresh = view.log.filter((e) => e.n > lastN);
  if (view.log.length) lastN = view.log[view.log.length - 1].n;
  for (const id of view.hand) if (!prev || !prev.hand.includes(id)) arriving.add(id);
  if (fresh.some((e) => e.ev.t === 'play' || e.ev.t === 'nope')) airHidden = true;
  for (const id of [...selected]) if (!view.hand.includes(id)) selected.delete(id);
  if (view.phase !== 'playing' || view.current !== ME || view.pending || view.choice) mode = null;
  if (prev && prev.current !== ME && view.current === ME && view.phase === 'playing') Sound.play('turn');
  render();
  if (!prev || (prev.phase !== 'playing' && view.phase === 'playing')) enqueue(() => dealAnim());
  for (const e of fresh) enqueue(() => animate(e.ev, prev, rects));
  // Carta que apareceu sem efeito nenhum pra trazê-la não pode ficar escondida.
  if (!running && !queue.length && (arriving.size || airHidden)) { arriving.clear(); airHidden = false; render(); }
}

function handRects() {
  const out = {};
  document.querySelectorAll('#hand .card').forEach((el) => { out[el.dataset.id] = Fx.box(el); });
  return out;
}

// ---------------------------------------------------------------- desenho das cartas
/** Cartas que já têm arte do Flow escolhida pelo Rafa (o resto continua com o sprite provisório). */
const FLOW_ART = new Set(['tatubum', 'cafune', 'nemvem', 'capivara']);
/** Cor de fundo por categoria (pedido do Rafa): bomba e desarme chamativos, pares com cor própria, efeitos no creme. */
const CATEGORY = { tatubum: 'cat-bomb', cafune: 'cat-defuse', capivara: 'cat-pair', mico: 'cat-pair', quati: 'cat-pair', tamandua: 'cat-pair', preguica: 'cat-pair' };

function cardEl(id, { back = false } = {}) {
  const el = document.createElement('div');
  if (back || !id) {
    el.className = 'card back flow-back';
    el.innerHTML = `<img class="back-art" src="art/verso.webp" alt="">`;
    return el;
  }
  const k = kindOf(id);
  const st = Sprites.style[k];
  el.className = `card ${k} ${CATEGORY[k] ?? 'cat-effect'}`;
  el.dataset.id = id;
  const art = FLOW_ART.has(k) ? `<img class="art flow" src="art/${k}.webp" alt="">` : `<img class="art" src="${Sprites.card(k).url}" alt="">`;
  el.innerHTML = `<div class="band" style="background:${st.band}"></div>${art}<div class="name">${cardName(k)}</div><div class="hint">${st.hint}</div>`;
  return el;
}

// ---------------------------------------------------------------- render
function render() {
  if (!view) return;
  renderTop();
  renderSeats();
  renderTable();
  renderHand();
  renderActions();
  renderPanel();
  renderLog();
  renderOver();
  $('#caption').innerHTML = captionText;
}

function renderTop() {
  const v = view;
  if (v.phase !== 'playing' || !v.current) { $('#turn').innerHTML = ''; return; }
  const who = v.current === ME ? '<b>SUA VEZ</b>' : `vez de <b>${nameOf(v.current).toUpperCase()}</b>`;
  $('#turn').innerHTML = who + (v.owed > 1 ? `<span class="owed">· ${v.owed} TURNOS</span>` : '');
}

function seatPos(i, n) {
  // Bots em arco no topo, usando a largura toda do palco.
  const t = n === 1 ? 0.5 : i / (n - 1);
  const margin = 210;
  const x = margin + t * (stageW - 2 * margin);
  const y = 18 + (1 - Math.sin(t * Math.PI)) * 34;
  return { x, y };
}

function renderSeats() {
  const v = view;
  const bots = players.filter((p) => p !== ME);
  const box = $('#seats');
  box.innerHTML = '';
  bots.forEach((p, i) => {
    const { x, y } = seatPos(i, bots.length);
    const el = document.createElement('div');
    el.className = 'seat';
    el.dataset.p = p;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    const dead = v.phase !== 'lobby' && !v.alive.includes(p);
    if (dead) el.classList.add('dead');
    if (v.winner === p) el.classList.add('winner');
    if (v.current === p) el.classList.add('turn');
    if (mode?.type === 'target' && validTarget(p)) {
      el.classList.add('targetable');
      el.onclick = () => chooseTarget(p);
    }
    const n = v.handCounts[p] ?? 0;
    const thinking = v.phase === 'playing' && v.current === p && !dead && !v.pending && !v.choice;
    const chip = v.choice?.who === p ? '<div class="chip">escolhendo…</div>'
      : !active.includes(p) && !dead ? '<div class="chip">caiu…</div>'
      : thinking ? '<div class="chip think">pensando…</div>' : '';
    // Leque de versinhos (até 9) + o número grande: dá pra ver de longe quantas cartas cada um tem.
    const shown = Math.min(n, 9);
    const fan = Array.from({ length: shown }, (_, k) => `<i style="rotate:${(k - (shown - 1) / 2) * 9}deg"></i>`).join('');
    el.innerHTML = `<img class="tatu critter" alt="">
      <div class="who">${nameOf(p)}</div>
      ${dead ? '<div class="count out">FORA</div>' : `<div class="count"><span class="fan">${fan}</span><b>${n}</b></div>`}${chip}`;
    // O bichinho em pixel art fica pronto num instante (e depois vem do cache).
    const img = el.querySelector('.critter');
    Sprites.critter(colorOf(p)).then((url) => { img.src = url; });
    box.appendChild(el);
  });
}

function anchorOf(p) {
  if (p === ME) return $('#hand');
  return document.querySelector(`.seat[data-p="${p}"] .tatu`) ?? $('#deck');
}

function renderTable() {
  const v = view;
  const deck = $('#deck');
  const stack = deck.querySelector('.stack');
  stack.innerHTML = '';
  const layers = Math.min(5, Math.ceil(v.drawCount / 6));
  for (let i = 0; i < layers; i++) {
    const b = cardEl(null, { back: true });
    b.style.transform = `translate(${-i * 3}px, ${-i * 3}px)`;
    stack.appendChild(b);
  }
  deck.querySelector('.label').textContent = `monte ${v.drawCount} · ${v.tatusInDraw} tatu${v.tatusInDraw === 1 ? '' : 's'}`;
  deck.classList.toggle('mine', canDraw());
  deck.onclick = () => { if (canDraw()) draw(); };

  const fut = $('#future');
  fut.innerHTML = '';
  if (v.peek) {
    fut.innerHTML = '<div class="tag">O FUTURO ↓</div>';
    v.peek.forEach((id) => fut.appendChild(cardEl(id)));
  }

  const air = $('#air');
  air.innerHTML = '';
  if (v.pending && !airHidden) {
    const cards = [...v.pending.play.cards, ...v.pending.nopes.map((n) => n.card)];
    cards.forEach((id, i) => {
      const c = cardEl(id);
      c.style.transform = `translate(${(i - (cards.length - 1) / 2) * 16}px, ${-i * 4}px) rotate(${(i % 2 ? 6 : -5)}deg)`;
      air.appendChild(c);
    });
  } else if (!v.pending) {
    air.innerHTML = `<div class="empty">${v.current === ME && v.phase === 'playing' ? 'jogue<br>aqui' : ''}</div>`;
  }

  const disc = $('#discard');
  disc.querySelectorAll('.card').forEach((c) => c.remove());
  v.discard.slice(-3).forEach((id, i, arr) => {
    const c = cardEl(id);
    c.style.transform = `rotate(${(i - arr.length + 1) * 7 + 3}deg)`;
    disc.appendChild(c);
  });
  renderBar();
}

function renderBar() {
  const bar = $('#bar');
  const p = view?.pending;
  if (!p) { bar.innerHTML = ''; return; }
  const left = Math.max(0, Math.ceil((p.resolvesAt - Date.now()) / 1000));
  if (left !== lastTic && left > 0) { lastTic = left; if (left <= 3) Sound.play('tic'); }
  bar.innerHTML = Array.from({ length: 5 }, (_, i) => `<i class="${i < left ? 'on' : ''}${i === left - 1 ? ' last' : ''}"></i>`).join('');
}

function tickTimers() {
  if (!view) return;
  renderBar();
  const t = document.querySelector('[data-timer]');
  if (t && view.choice) t.textContent = Math.max(0, Math.ceil((view.choice.deadline - Date.now()) / 1000)) + 's';
}

function renderHand() {
  const v = view;
  const hand = $('#hand');
  hand.innerHTML = '';
  hand.classList.toggle('myturn', v.phase === 'playing' && v.current === ME && !v.pending && !v.choice);
  hand.classList.toggle('giving', v.choice?.kind === 'favor' && v.choice.who === ME);
  if (v.phase === 'playing' && !v.alive.includes(ME)) {
    hand.innerHTML = '<div class="dead">VOCÊ EXPLODIU · AGORA SÓ ASSISTE</div>';
    return;
  }
  const order = orderedHand();
  const n = order.length;
  const hw = hand.clientWidth || 940;
  const step = Math.min(118, (hw - 112) / Math.max(1, n - 1));
  const width = step * (n - 1) + 112;
  order.forEach((id, i) => {
    const c = cardEl(id);
    c.style.left = (hw - width) / 2 + i * step + 'px';
    c.style.zIndex = i;
    if (selected.has(id)) c.classList.add('sel');
    if (arriving.has(id)) c.classList.add('arriving');
    c.onpointerdown = (e) => startDrag(e, id);
    c.ondblclick = () => { selected = new Set([id]); playSelected(); };
    c.onmouseleave = () => zoom(null);
    hand.appendChild(c);
  });
}

// ---------------------------------------------------------------- ordem da mão e arrastar (como no Diquisti)
/** A ordem da mão é só daqui do PC: as cartas novas entram no fim. */
let handOrder = [];
function orderedHand() {
  const hand = view.hand;
  handOrder = [...handOrder.filter((id) => hand.includes(id)), ...hand.filter((id) => !handOrder.includes(id))];
  return handOrder;
}

let drag = null;
const needsTarget = (kind) => kind === 'favor' || kind === 'par' || kind === 'trio';

function stagePoint(e) {
  const r = stage.getBoundingClientRect();
  return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
}

/** Onde o ponteiro está: um assento, a mesa ou a mão (ou nada). */
function dropTarget(e) {
  for (const el of document.elementsFromPoint(e.clientX, e.clientY)) {
    const seat = el.closest?.('.seat');
    if (seat) return { type: 'seat', p: seat.dataset.p, el: seat };
    if (el.closest?.('#table')) return { type: 'table', el: $('#table') };
    if (el.closest?.('#hand')) return { type: 'hand', el: $('#hand') };
  }
  return null;
}

function startDrag(e, id) {
  if (e.button !== 0) return;
  e.preventDefault();
  drag = { id, x0: e.clientX, y0: e.clientY, moved: false, ghost: null, ids: [id], hover: null };
  addEventListener('pointermove', onDragMove);
  addEventListener('pointerup', onDragEnd, { once: true });
}

function onDragMove(e) {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
  if (!drag.moved) {
    drag.moved = true;
    // Arrastar uma carta da seleção leva a seleção inteira (par, trio, 5 diferentes).
    drag.ids = selected.has(drag.id) && selected.size > 1 ? orderedHand().filter((x) => selected.has(x)) : [drag.id];
    const g = cardEl(drag.id);
    g.classList.add('ghost');
    if (drag.ids.length > 1) g.dataset.n = drag.ids.length;
    $('#fxlayer').appendChild(g);
    drag.ghost = g;
    drag.ids.forEach((x) => document.querySelector(`#hand .card[data-id="${x}"]`)?.classList.add('dragging'));
    stage.classList.add('dragging');
    zoom(null);
    Sound.play('select');
  }
  const p = stagePoint(e);
  drag.ghost.style.transform = `translate(${p.x}px, ${p.y}px) translate(-50%, -60%) rotate(-4deg) scale(1.08)`;
  const t = dropTarget(e);
  const el = t && t.type !== 'hand' ? t.el : null;
  if (drag.hover !== el) {
    drag.hover?.classList.remove('drop');
    el?.classList.add('drop');
    drag.hover = el;
  }
}

function onDragEnd(e) {
  removeEventListener('pointermove', onDragMove);
  const d = drag;
  drag = null;
  if (!d) return;
  if (!d.moved) { clickCard(d.id); return; }
  d.ghost.remove();
  d.hover?.classList.remove('drop');
  stage.classList.remove('dragging');
  document.querySelectorAll('#hand .card.dragging').forEach((c) => c.classList.remove('dragging'));
  const t = dropTarget(e);
  if (!t) { render(); return; }
  if (t.type === 'hand') { reorder(d.ids, e); return; }
  dropPlay(d.ids, t);
}

/** Solta dentro da mão: as cartas arrastadas entram onde o ponteiro está. */
function reorder(ids, e) {
  const x = stagePoint(e).x;
  const rest = orderedHand().filter((id) => !ids.includes(id));
  let at = 0;
  for (const id of rest) {
    const el = document.querySelector(`#hand .card[data-id="${id}"]`);
    if (el && Fx.box(el).x < x) at++;
  }
  handOrder = [...rest.slice(0, at), ...ids, ...rest.slice(at)];
  Sound.play('select');
  renderHand();
}

/** Solta na mesa ou num adversário: joga (ou dá o Favor, ou dá Nem vem!). */
function dropPlay(ids, t) {
  const v = view;
  if (v.choice?.kind === 'favor' && v.choice.who === ME) {
    if (ids.length === 1) dispatch(ME, { type: 'choose', card: ids[0] });
    render();
    return;
  }
  if (v.pending && ids.length === 1 && kindOf(ids[0]) === 'nemvem') { nope(); return; }
  selected = new Set(ids);
  const kind = selectedPlay();
  if (!kind) { toast('Essas cartas não formam jogada.'); Sound.play('error'); render(); return; }
  if (needsTarget(kind)) {
    mode = { type: 'target', play: { cards: ids }, kind };
    if (t.type === 'seat' && validTarget(t.p)) { chooseTarget(t.p); return; }
    captionText = 'Escolha um adversário <span class="timer">↑</span>';
    render();
    return;
  }
  send({ cards: ids });
}

// ---------------------------------------------------------------- jogada do humano
function canDraw() {
  const v = view;
  return v && v.phase === 'playing' && v.current === ME && v.alive.includes(ME) && !v.pending && !v.choice;
}

function clickCard(id) {
  const v = view;
  if (v.choice?.kind === 'favor' && v.choice.who === ME) {
    dispatch(ME, { type: 'choose', card: id });
    return;
  }
  if (selected.has(id)) selected.delete(id);
  else selected.add(id);
  mode = null;
  Sound.play('select');
  render();
}

/** O que as cartas escolhidas formam (espelho de play.ts, só pra mostrar o botão certo). */
function selectedPlay() {
  const kinds = [...selected].map(kindOf);
  if (!kinds.length) return null;
  const same = kinds.every((k) => k === kinds[0]);
  if (kinds.length === 1) return ['ataque', 'pular', 'favor', 'embaralhar', 'espiar'].includes(kinds[0]) ? kinds[0] : null;
  if (kinds.length === 2 && same) return 'par';
  if (kinds.length === 3 && same) return 'trio';
  if (kinds.length === 5 && new Set(kinds).size === 5) return 'cinco';
  return null;
}

function validTarget(p) {
  return p !== ME && view.alive.includes(p) && (view.handCounts[p] ?? 0) > 0;
}

function playSelected() {
  const kind = selectedPlay();
  if (!kind) return;
  const play = { cards: [...selected] };
  if (kind === 'favor' || kind === 'par' || kind === 'trio') {
    mode = { type: 'target', play, kind };
    captionText = 'Escolha um adversário <span class="timer">↑</span>';
    render();
    return;
  }
  send(play);
}

function chooseTarget(p) {
  const play = { ...mode.play, target: p };
  if (mode.kind === 'trio') {
    mode = { type: 'ask', play };
    captionText = `Que carta você pede pra ${nameOf(p)}?`;
    render();
    return;
  }
  send(play);
}

function send(play) {
  mode = null;
  if (dispatch(ME, { type: 'play', ...play })) selected.clear();
  render();
}

function draw() {
  dispatch(ME, { type: 'draw' });
}

function nope() {
  dispatch(ME, { type: 'nope' });
}

function renderActions() {
  const v = view;
  const box = $('#actions');
  box.innerHTML = '';
  if (v.phase !== 'playing' || !v.alive.includes(ME)) return;
  const myNopes = v.hand.filter((c) => kindOf(c) === 'nemvem').length;
  if (v.pending && myNopes) {
    const b = button(`NEM VEM! (${myNopes})`, nope);
    b.id = 'nope';
    box.appendChild(b);
  }
  if (v.current === ME && !v.pending && !v.choice) {
    const kind = selectedPlay();
    if (mode?.type === 'ask') {
      box.appendChild(hint('escolha a carta no painel'));
    } else if (mode?.type === 'target') {
      box.appendChild(hint('clique num adversário'));
      box.appendChild(button('CANCELAR', () => { mode = null; captionText = ''; render(); }, 'ghost'));
    } else if (selected.size) {
      const b = button(kind ? `JOGAR ${PLAY_LABEL[kind]}` : 'NÃO FORMA JOGADA', playSelected);
      if (!kind) b.disabled = true;
      box.appendChild(b);
    } else {
      box.appendChild(hint('escolha cartas pra jogar ou'));
    }
    box.appendChild(button('COMPRAR', draw, 'yellow'));
  }
}

function button(label, onClick, cls = '') {
  const b = document.createElement('button');
  b.className = 'btn ' + cls;
  b.innerHTML = `<span>${label}</span>`;
  b.onclick = onClick;
  return b;
}
function hint(text) {
  const d = document.createElement('div');
  d.className = 'hint';
  d.textContent = text;
  return d;
}

// ---------------------------------------------------------------- painéis de escolha
let cafunePos = 0;
/** Enquanto o tatu soldado desarma a bomba, o painel de esconder o tatu espera. */
let holdPanel = false;
function renderPanel() {
  const v = view;
  const panel = $('#panel');
  if (holdPanel) { panel.innerHTML = ''; return; }
  const c = v.choice;
  const timer = '<span class="timer" data-timer></span>';
  if (mode?.type === 'ask') {
    panel.innerHTML = `<h2>QUAL CARTA VOCÊ PEDE?</h2><p>Se ${nameOf(mode.play.target)} tiver, tem que te dar.</p><div class="row"></div>`;
    const row = panel.querySelector('.row');
    T.KITTENS_CARD_KINDS.filter((k) => k !== 'tatubum').forEach((k) => {
      row.appendChild(button(cardName(k), () => send({ ...mode.play, ask: k }), 'small'));
    });
    row.appendChild(button('CANCELAR', () => { mode = null; render(); }, 'small ghost'));
    return;
  }
  if (!c || c.who !== ME) { panel.innerHTML = ''; return; }
  if (c.kind === 'cafune') {
    const max = v.drawCount;
    cafunePos = Math.min(cafunePos, max);
    panel.innerHTML = `<h2>UFA! ONDE ESCONDER O TATU? ${timer}</h2><p>Só você vai saber. O monte tem ${max} carta${max === 1 ? '' : 's'}.</p>
      <div class="pos"></div><input type="range" min="0" max="${max}" step="1" value="${cafunePos}"><div class="row"></div>`;
    const pos = panel.querySelector('.pos');
    const label = (n) => (n === 0 ? 'no topo (o próximo compra!)' : n === max ? 'no fundo' : `${n + 1}ª carta de cima`);
    pos.textContent = label(cafunePos);
    const range = panel.querySelector('input');
    range.oninput = () => { cafunePos = Number(range.value); pos.textContent = label(cafunePos); };
    const row = panel.querySelector('.row');
    row.appendChild(button('ESCONDER AQUI', () => dispatch(ME, { type: 'choose', position: cafunePos }), 'yellow'));
    row.appendChild(button('NO TOPO', () => dispatch(ME, { type: 'choose', position: 0 }), 'small'));
    row.appendChild(button('NO FUNDO', () => dispatch(ME, { type: 'choose', position: max }), 'small'));
    row.appendChild(button('ALEATÓRIO', () => dispatch(ME, { type: 'choose', position: 'random' }), 'small ghost'));
  } else if (c.kind === 'favor') {
    panel.innerHTML = `<h2>FAVOR PRA ${nameOf(c.to).toUpperCase()} ${timer}</h2><p>Clique numa carta da sua mão pra dar.</p>`;
    panel.style.top = '300px';
  } else if (c.kind === 'cinco') {
    panel.innerHTML = `<h2>PEGUE UMA DO DESCARTE ${timer}</h2><div class="cards"></div>`;
    const row = panel.querySelector('.cards');
    c.options.filter((id) => v.discard.includes(id)).slice(-8).forEach((id) => {
      const el = cardEl(id);
      el.onclick = () => dispatch(ME, { type: 'choose', card: id });
      row.appendChild(el);
    });
  }
  tickTimers();
}

// ---------------------------------------------------------------- diário
const logLines = [];
/** "Você" só com maiúscula no começo da frase. */
function textOf(ev, prevPending) {
  return rawText(ev, prevPending).replace(/(?!^)Você/g, 'você');
}
function rawText(ev, prevPending) {
  const n = (p) => nameOf(p);
  switch (ev.t) {
    case 'play': return `${n(ev.by)} jogou ${PLAY_LABEL[ev.play]}${ev.target ? ' em ' + n(ev.target) : ''}${ev.ask ? ', pedindo ' + cardName(ev.ask) : ''}`;
    case 'nope': return `${n(ev.by)}: NEM VEM!`;
    case 'resolved': {
      const whose = (label) => (ev.by === ME ? `Seu ${label}` : `${label} de ${n(ev.by)}`);
      if (ev.canceled) return `${whose(PLAY_LABEL[ev.play])} foi cancelado`;
      return {
        ataque: `${whose(PLAY_LABEL.ataque)} valeu!`,
        pular: `${n(ev.by)} pulou`,
        embaralhar: `${n(ev.by)} embaralhou o monte`,
        espiar: `${n(ev.by)} espiou o futuro`,
        favor: `${prevPending?.play.target ? n(prevPending.play.target) : 'alguém'} vai dar uma carta pra ${n(ev.by)}`,
        par: `${whose('PAR')} valeu!`,
        trio: `${whose('TRIO')} valeu!`,
        cinco: `${n(ev.by)} vai pegar uma do descarte`,
      }[ev.play];
    }
    case 'draw': return ev.card ? `Você comprou ${cardName(kindOf(ev.card))}` : `${n(ev.by)} comprou uma carta`;
    case 'cafune': return `${n(ev.by)} comprou o TATUBUM… e fez CAFUNÉ!`;
    case 'hid': return `${n(ev.by)} escondeu o tatu no monte`;
    case 'boom': return `${n(ev.by)} EXPLODIU!`;
    case 'left': return `${n(ev.by)} caiu e saiu do jogo`;
    case 'gave': return ev.card ? `${n(ev.from)} deu ${cardName(kindOf(ev.card))} pra ${n(ev.to)}` : `${n(ev.from)} deu uma carta pra ${n(ev.to)}`;
    case 'stole': return ev.card ? `${n(ev.to)} roubou ${cardName(kindOf(ev.card))} de ${n(ev.from)}` : `${n(ev.to)} roubou uma carta de ${n(ev.from)}`;
    case 'asked': return ev.card ? `${n(ev.from)} teve que dar ${cardName(ev.ask)} pra ${n(ev.to)}` : `${n(ev.from)} não tinha ${cardName(ev.ask)}`;
    case 'picked': return `${n(ev.by)} pegou ${ev.card ? cardName(kindOf(ev.card)) : 'uma carta'} do descarte`;
    case 'win': return `${n(ev.by)} sobreviveu e venceu!`;
  }
  return '';
}
function pushLog(text, cls = '') {
  logLines.push({ text, cls });
  if (logLines.length > 14) logLines.shift();
  renderLog();
}
function renderLog() {
  $('#log').innerHTML = '<div class="h">DIÁRIO</div>' + logLines.map((l) => `<p class="${l.cls}">${l.text}</p>`).join('');
}

function say(text) {
  captionText = text;
  $('#caption').innerHTML = text;
}

// ---------------------------------------------------------------- animações (dirigidas pelo diário)
async function dealAnim() {
  say('Distribuindo as cartas…');
  Sound.play('shuffle');
  const deck = $('#deck .stack');
  const targets = players.filter((p) => p !== ME);
  for (let r = 0; r < 2; r++) {
    for (const p of targets) {
      Fx.fly({ node: cardEl(null, { back: true }), from: deck, to: anchorOf(p), dur: 260, scaleTo: 0.4 });
      await Fx.wait(45);
    }
  }
  const flights = [...view.hand].map((id, i) => Fx.wait(i * 110).then(async () => {
    const el = document.querySelector(`#hand .card[data-id="${id}"]`);
    if (!el) return;
    Sound.play('draw');
    await Fx.fly({ node: cardEl(null, { back: true }), from: deck, to: el, dur: 320, flipTo: cardEl(id) });
    arriving.delete(id);
    el.classList.remove('arriving');
  }));
  await Promise.all(flights);
  say(view.current === ME ? 'Sua vez! Jogue cartas ou compre.' : `Vez de ${nameOf(view.current)}`);
}

async function animate(ev, prev, rects) {
  const text = textOf(ev, prev?.pending);
  const mine = ev.by === ME || ev.to === ME || ev.from === ME;
  pushLog(text, ev.t === 'boom' ? 'bad' : mine ? 'me' : '');
  const air = $('#air');
  switch (ev.t) {
    case 'play': {
      say(text);
      Sound.play('card');
      const cards = view.pending?.play.cards ?? prev?.pending?.play.cards ?? [];
      const from = (id) => (ev.by === ME && rects[id] ? rects[id] : anchorOf(ev.by));
      await Promise.all(cards.map((id, i) => Fx.wait(i * 70).then(() => Fx.fly({ node: cardEl(id), from: from(id), to: air, dur: 420, rot: (i % 2 ? 6 : -5), trail: '#f2c14e' }))));
      airHidden = false;
      renderTable();
      if (ev.play === 'ataque') Fx.sparks(air);
      break;
    }
    case 'nope': {
      say(text);
      airHidden = false;
      renderTable();
      Sound.play('nope');
      Fx.flash('#e4572e', 140);
      await Fx.stamp(air, 'NEM VEM!');
      break;
    }
    case 'resolved': {
      const pend = prev?.pending;
      const cards = pend ? [...pend.play.cards, ...pend.nopes.map((x) => x.card)] : [];
      if (ev.canceled) {
        say(`✗ ${text}`);
        Sound.play('error');
        await Fx.cross(air);
      } else {
        say(text);
        if (ev.play === 'ataque') {
          Sound.play('attack');
          Fx.slash(air);
          const next = view.current;
          if (next) {
            const s = next === ME ? $('#hand') : document.querySelector(`.seat[data-p="${next}"]`);
            s?.classList.add('hit');
            setTimeout(() => s?.classList.remove('hit'), 600);
            Fx.pop(`${view.owed} TURNOS!`, next === ME ? { x: 650, y: 600 } : Fx.box(s), { size: 34, hold: 500, color: '#e4572e' });
          }
        } else if (ev.play === 'pular') Sound.play('skip');
        else if (ev.play === 'embaralhar') {
          Sound.play('shuffle');
          $('#deck').classList.add('shuffling');
          Fx.glitter($('#deck .stack'), '#c9a8ee');
          setTimeout(() => $('#deck').classList.remove('shuffling'), 800);
        } else if (ev.play === 'espiar') {
          Sound.play('peek');
          Fx.glitter($('#deck .stack'));
          if (ev.by === ME) say('O FUTURO: as 3 de cima estão ao lado do monte');
          else Fx.icon(Sprites.card('espiar').url, $('#deck .stack'), { size: 110 });
        }
      }
      await Promise.all(cards.map((id) => Fx.fly({ node: cardEl(id), from: air, to: $('#discard'), dur: 320 })));
      await Fx.wait(250);
      break;
    }
    case 'draw': {
      Sound.play('draw');
      if (ev.by === ME && ev.card) {
        say(text);
        const el = document.querySelector(`#hand .card[data-id="${ev.card}"]`);
        await Fx.fly({ node: cardEl(null, { back: true }), from: $('#deck .stack'), to: el ?? $('#hand'), dur: 420, flipTo: cardEl(ev.card) });
        arriving.delete(ev.card);
        el?.classList.remove('arriving');
      } else {
        await Fx.fly({ node: cardEl(null, { back: true }), from: $('#deck .stack'), to: anchorOf(ev.by), dur: 380, scaleTo: 0.45 });
      }
      if (view.current === ME && !view.pending && !view.choice) say('Sua vez! Jogue cartas ou compre.');
      break;
    }
    case 'cafune':
    case 'boom': {
      say(`${nameOf(ev.by)} comprou o… TATUBUM!`);
      const cx = stageW / 2;
      const big = cardEl('tatubum-0');
      big.classList.add('bigcard', 'shaking');
      big.style.left = cx + 'px';
      big.style.top = '470px';
      $('#fxlayer').appendChild(big);
      Sound.play('fuse');
      const sp = setInterval(() => Fx.sparks({ x: cx + 15, y: 340 }), 120);
      if (ev.t === 'cafune') {
        holdPanel = true;
        renderPanel();
        // O tatu soldado entra andando pela mesa, corta o fio e o pavio apaga.
        await defuseWalk(cx);
        clearInterval(sp);
        big.classList.remove('shaking');
        Sound.play('cafune');
        Fx.hearts({ x: cx, y: 470 });
        say(text);
        await Fx.pop('UFA!', { x: cx, y: 260 }, { size: 60, hold: 700, color: '#ff8fab' });
        big.remove();
        holdPanel = false;
        renderPanel();
      } else {
        await Fx.wait(1100);
        clearInterval(sp);
        big.remove();
        Sound.play('boom');
        Fx.flash('#fff3c4', 220);
        Fx.shake(600, 14);
        Fx.boom({ x: cx, y: 470 });
        say(text);
        await Fx.pop('BUM!', { x: cx, y: 450 }, { size: 150, hold: 900, color: '#e4572e' });
      }
      break;
    }
    case 'hid': {
      say(text);
      Sound.play('card');
      await Fx.fly({ node: cardEl(null, { back: true }), from: anchorOf(ev.by), to: $('#deck .stack'), dur: 420, scaleFrom: 0.6 });
      break;
    }
    case 'left': {
      say(text);
      Sound.play('error');
      await Fx.wait(600);
      break;
    }
    case 'gave':
    case 'stole':
    case 'asked':
    case 'picked': {
      say(text);
      Sound.play('give');
      const card = ev.card;
      if (ev.t === 'asked' && !card) { await Fx.wait(700); break; }
      const from = ev.t === 'picked' ? $('#discard') : ev.from === ME && card && rects[card] ? rects[card] : anchorOf(ev.from);
      const toP = ev.t === 'picked' ? ev.by : ev.to;
      const target = toP === ME && card ? document.querySelector(`#hand .card[data-id="${card}"]`) ?? $('#hand') : anchorOf(toP);
      await Fx.fly({ node: cardEl(card, { back: !card }), from, to: target, dur: 520, trail: '#ff8fab' });
      if (card) { arriving.delete(card); document.querySelector(`#hand .card[data-id="${card}"]`)?.classList.remove('arriving'); }
      break;
    }
    case 'win': {
      say(text);
      Sound.play('win');
      Fx.fireworks({ x: stageW / 2, y: 420 });
      await Fx.pop(ev.by === ME ? 'VOCÊ VENCEU!' : `${nameOf(ev.by).toUpperCase()} VENCEU!`, { x: stageW / 2, y: 420 }, { size: 52, hold: 1400 });
      renderOver(true);
      break;
    }
  }
}

/**
 * Desarme (pedido do Rafa): o tatu soldado (arte do Flow, fundo recortado) entra andando pela esquerda até a carta
 * do Tatubum no centro, corta o fio com o alicate (faísca + "clic") e sai andando de volta.
 */
async function defuseWalk(cx) {
  const s = document.createElement('img');
  s.src = 'art/soldado.png';
  s.className = 'soldier walking';
  $('#fxlayer').appendChild(s);
  const y = 500; // pés na altura da base da carta grande
  const stop = cx - 205; // o alicate (lado direito do soldado) encosta na carta
  const at = (x, flip = 1) => `translate(${x}px, ${y}px) translate(-50%, -100%) scaleX(${flip})`;
  const walk = (from, to, flip, ms) =>
    Fx.REDUCED || document.hidden
      ? Promise.resolve()
      : s.animate([{ transform: at(from, flip) }, { transform: at(to, flip) }], { duration: ms, easing: 'steps(14, end)', fill: 'forwards' }).finished.catch(() => {});
  s.style.transform = at(-140);
  await Promise.race([walk(-140, stop, 1, 1300), Fx.wait(1500)]);
  s.classList.remove('walking');
  s.style.transform = at(stop);
  // corta o fio
  await Fx.wait(250);
  s.classList.add('snip');
  Sound.play('snip');
  Fx.glitter({ x: stop + 80, y: 430 }, '#ffffff');
  Fx.sparks({ x: stop + 80, y: 430 });
  await Fx.wait(450);
  s.classList.remove('snip');
  // missão cumprida: vira e volta
  (async () => {
    s.classList.add('walking');
    await Promise.race([walk(stop, -160, -1, 1100), Fx.wait(1300)]);
    s.remove();
  })();
}

// ---------------------------------------------------------------- fim e menu
function renderOver(force = false) {
  const over = $('#over');
  if (view?.phase !== 'gameover' || (running && !force)) { over.hidden = true; return; }
  over.hidden = false;
  over.innerHTML = `<div class="biglogo" style="font-size:44px">${view.winner === ME ? 'VOCÊ SOBREVIVEU!' : (view.winner ? nameOf(view.winner).toUpperCase() + ' SOBREVIVEU!' : 'FIM')}</div>`;
  over.appendChild(button('JOGAR DE NOVO', () => { dispatch(ME, { type: 'again' }); }, 'yellow'));
  over.appendChild(button('MENU', toMenu));
}

let nbots = 3;
$('#less').onclick = () => { nbots = Math.max(1, nbots - 1); $('#nbots').textContent = nbots; Sound.play('select'); };
$('#more').onclick = () => { nbots = Math.min(7, nbots + 1); $('#nbots').textContent = nbots; Sound.play('select'); };
$('#play').onclick = () => {
  players = Array.from({ length: nbots + 1 }, (_, i) => `p${i}`);
  active = [...players];
  for (const p of players) botMem[p] = {};
  state = T.initialKittensState();
  view = null;
  lastN = -1;
  logLines.length = 0;
  $('#menu').hidden = true;
  stage.classList.remove('menu-open');
  dispatch(ME, { type: 'start' });
};
function toMenu() {
  state = T.initialKittensState();
  view = null;
  $('#over').hidden = true;
  $('#menu').hidden = false;
  stage.classList.add('menu-open');
  ['#seats', '#hand', '#actions', '#panel', '#log', '#turn', '#caption', '#air', '#future', '#bar'].forEach((s) => { $(s).innerHTML = ''; });
  captionText = '';
}
$('#tomenu').onclick = toMenu;
$('#sound').onclick = () => { const m = Sound.toggle(); $('#sound span').textContent = m ? 'SOM: NÃO' : 'SOM: SIM'; };
$('#drop').onclick = () => {
  const alive = view?.alive.filter((p) => p !== ME && active.includes(p)) ?? [];
  if (!alive.length) return;
  const p = alive[Math.floor(Math.random() * alive.length)];
  active = active.filter((x) => x !== p);
  toast(`${nameOf(p)} caiu (passou dos 30 s)`);
};
$('#speed').onclick = () => {
  botSpeed = botSpeed === 1 ? 0.35 : 1;
  $('#speed span').textContent = botSpeed === 1 ? 'BOTS: NORMAIS' : 'BOTS: RÁPIDOS';
};
addEventListener('keydown', (e) => {
  if (!view || view.phase !== 'playing') return;
  if (e.key === 'n' || e.key === 'N') nope();
  if (e.key === ' ' && canDraw()) { e.preventDefault(); draw(); }
  if (e.key === 'Enter') playSelected();
  if (e.key === 'Escape') { mode = null; selected.clear(); render(); }
});

let toastTimer = 0;
function toast(text) {
  $('#toast').textContent = text;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('#toast').textContent = ''; }, 2200);
}

// ---------------------------------------------------------------- zoom (rodinha, como no Diquisti)
let zoomed = null;
function zoom(id) {
  if (id === zoomed) return;
  zoomed = id;
  const v = $('#viewer');
  v.innerHTML = '';
  if (id) { v.appendChild(cardEl(id)); Sound.play('zoom'); }
}
stage.addEventListener('wheel', (e) => {
  const card = e.target.closest('.card[data-id]');
  if (!card) { zoom(null); return; }
  e.preventDefault();
  zoom(e.deltaY < 0 ? card.dataset.id : null);
}, { passive: false });

// ---------------------------------------------------------------- galeria das cartas
const ABOUT = {
  tatubum: 'Comprou e não tem Cafuné? Explodiu, tá fora. Tem sempre um a menos que o número de jogadores.',
  cafune: 'Usado na hora em que você compra o Tatubum: o tatu volta pro monte onde você quiser, em segredo.',
  nemvem: 'Cancela a carta no ar, mesmo fora da sua vez. Dá pra dar Nem vem! no Nem vem!.',
  ataque: 'Termina sua vez sem comprar. O próximo joga 2 turnos (ou os seus + 2, se você estava sob ataque).',
  pular: 'Termina um turno seu sem comprar.',
  favor: 'Um adversário escolhe uma carta da mão dele pra te dar.',
  embaralhar: 'Embaralha o monte. Bom quando você sabe que tem tatu em cima.',
  espiar: 'Você vê as 3 cartas de cima do monte. Só você.',
  capivara: 'Os bichos sozinhos não fazem nada: junte pares e trios.',
};
$('#cards').onclick = () => {
  const g = $('#gallery');
  const kinds = ['tatubum', 'cafune', 'nemvem', 'ataque', 'pular', 'favor', 'embaralhar', 'espiar', 'capivara'];
  g.innerHTML = '<h2>AS CARTAS</h2><div class="grid"></div><div class="foot"><p>Combos (qualquer carta): PAR rouba uma carta ao acaso · TRIO pede uma carta pelo nome · 5 DIFERENTES pega uma do descarte. Toda carta jogada fica 5 s no ar pra alguém dar Nem vem!.</p></div>';
  const grid = g.querySelector('.grid');
  kinds.forEach((k, i) => {
    const item = document.createElement('div');
    item.className = 'item';
    item.appendChild(cardEl(`${k}-${i}`));
    const p = document.createElement('p');
    p.innerHTML = `<b>${k === 'capivara' ? 'BICHOS (5 TIPOS)' : cardName(k)}</b>${ABOUT[k]}`;
    item.appendChild(p);
    grid.appendChild(item);
  });
  g.querySelector('.foot').appendChild(button('VOLTAR', () => { g.hidden = true; }, 'yellow'));
  g.hidden = false;
  Sound.play('select');
};

fit();

// ---------------------------------------------------------------- bots
setInterval(() => {
  if (state.phase !== 'playing') return;
  for (const p of players) {
    if (p === ME || !active.includes(p)) continue;
    // Enquanto os efeitos rodam, os bots só podem reagir à carta no ar (a janela de 5 s não espera a animação).
    if (running && !state.pending) continue;
    const mem = botMem[p];
    if (mem.timer) continue;
    const d = Bots.decide(T.kittensViewFor(state, p), p, mem);
    if (!d) continue;
    mem.timer = setTimeout(() => {
      mem.timer = null;
      if (!running || d.action.type === 'nope') dispatch(p, d.action);
    }, d.delay * botSpeed);
  }
}, 250);
